steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/fridgepilot-backend:$COMMIT_SHA', '.']

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fridgepilot-backend:$COMMIT_SHA']

  # Run database migrations
  - name: 'gcr.io/$PROJECT_ID/fridgepilot-backend:$COMMIT_SHA'
    entrypoint: bundle
    args:
      - 'exec'
      - 'rails'
      - 'db:migrate'
    env:
      - 'RAILS_ENV=production'
      - 'RACK_ENV=production'
    secretEnv:
      - 'DATABASE_URL'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fridgepilot-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/fridgepilot-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'RAILS_ENV=production,RACK_ENV=production,RAILS_LOG_TO_STDOUT=true,RAILS_SERVE_STATIC_FILES=true'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'

images:
  - 'gcr.io/$PROJECT_ID/fridgepilot-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
